apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

/**
 * Gemini Mail - Android Configuration
 * Optimized for performance, security, and multi-platform compatibility
 */

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.geminimail.mobile"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    ndkVersion "25.1.8937393"

    defaultConfig {
        applicationId "com.geminimail.mobile"
        minSdkVersion 24  // Android 7.0+ for better security and TLS 1.3
        targetSdkVersion 34
        versionCode 40
        versionName "4.0.0"

        // Multi-DPI support
        vectorDrawables.useSupportLibrary = true

        // App linking and deep links
        manifestPlaceholders = [
            appAuthRedirectScheme: 'geminimail'
        ]

        // Build config fields
        buildConfigField "String", "API_BASE_URL", "\"https://api.geminimail.app\""
        buildConfigField "boolean", "ENABLE_PERPLEXITY", "true"
        buildConfigField "boolean", "ENABLE_SMART_LINKS", "true"
        buildConfigField "boolean", "ENABLE_ATTACHMENT_DETECTOR", "true"

        // Proguard optimizations
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // Test configuration
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Additional optimizations
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        staging {
            initWith release
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            matchingFallbacks = ['release']
        }
    }

    // Product flavors for different markets
    flavorDimensions "market"
    productFlavors {
        playstore {
            dimension "market"
            buildConfigField "String", "STORE", "\"google\""
        }
        fdroid {
            dimension "market"
            buildConfigField "String", "STORE", "\"fdroid\""
        }
        amazon {
            dimension "market"
            buildConfigField "String", "STORE", "\"amazon\""
        }
    }

    // Compile options for Java 11
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // Enable View Binding
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
    }

    // Split APKs by ABI for smaller downloads
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    // Lint options
    lint {
        abortOnError false
        checkReleaseBuilds true
        warningsAsErrors false
    }

    // Bundle optimization
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android")

    // AndroidX Core
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.activity:activity-ktx:1.8.2")
    implementation("androidx.fragment:fragment-ktx:1.6.2")

    // Material Design 3
    implementation("com.google.android.material:material:1.11.0")

    // Security
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("androidx.biometric:biometric:1.1.0")

    // Network
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")

    // Clipboard & File handling
    implementation("androidx.documentfile:documentfile:1.0.1")

    // Push Notifications
    implementation("com.google.firebase:firebase-messaging:23.4.0")

    // Work Manager for background sync
    implementation("androidx.work:work-runtime-ktx:2.9.0")

    // Lifecycle
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")

    // Image loading
    implementation("io.coil-kt:coil:2.5.0")

    // Testing
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")

    // Flipper for debugging
    debugImplementation("com.facebook.flipper:flipper:0.182.0")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:0.182.0")

    // Hermes JS Engine
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

// Play Services plugin (if using Google services)
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}
