name: Build Test

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        working-directory: packages/backend
        run: npm run test:ci

      - name: Check coverage threshold
        working-directory: packages/backend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            FUNCS=$(cat coverage/coverage-summary.json | jq '.total.functions.pct')
            BRANCHES=$(cat coverage/coverage-summary.json | jq '.total.branches.pct')
            STMTS=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')

            echo "📊 Backend Coverage Report:"
            echo "  Lines:      ${LINES}%"
            echo "  Functions:  ${FUNCS}%"
            echo "  Branches:   ${BRANCHES}%"
            echo "  Statements: ${STMTS}%"

            if (( $(echo "$LINES < 70" | bc -l) )); then
              echo "❌ Line coverage ${LINES}% is below threshold (70%)"
              exit 1
            fi
            echo "✅ Coverage meets minimum threshold"
          else
            echo "⚠️ Coverage summary not found"
            exit 1
          fi

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./packages/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        working-directory: packages/frontend
        run: npm run test:coverage

      - name: Check frontend coverage
        working-directory: packages/frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            FUNCS=$(cat coverage/coverage-summary.json | jq '.total.functions.pct')
            BRANCHES=$(cat coverage/coverage-summary.json | jq '.total.branches.pct')
            STMTS=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')

            echo "📊 Frontend Coverage Report:"
            echo "  Lines:      ${LINES}%"
            echo "  Functions:  ${FUNCS}%"
            echo "  Branches:   ${BRANCHES}%"
            echo "  Statements: ${STMTS}%"

            if (( $(echo "$LINES < 70" | bc -l) )); then
              echo "⚠️ Line coverage ${LINES}% is below target (70%)"
              echo "Note: Frontend coverage will be enforced in future releases"
              # No exit 1 por ahora para frontend
            else
              echo "✅ Coverage meets minimum threshold"
            fi
          else
            echo "⚠️ Coverage summary not found"
          fi

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./packages/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

  test-build:
    name: Build Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        run: |
          # Remove trailing hyphens and convert to lowercase for valid Docker image names
          REPO_NAME=$(echo "${{ github.repository }}" | sed 's/-*$//' | tr '[:upper:]' '[:lower:]')
          echo "Original: ${{ github.repository }}"
          echo "Normalized: ${REPO_NAME}"
          echo "name=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.service }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=test-

      - name: Build ${{ matrix.service }} image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build successful for ${{ matrix.service }}
        run: |
          echo "✅ La imagen ${{ matrix.service }} se construyó exitosamente"
          echo "Tags que se utilizarían: ${{ steps.meta.outputs.tags }}"
