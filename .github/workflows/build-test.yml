name: Build Test

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository name
        id: repo
        run: |
          # Remove trailing hyphens and convert to lowercase for valid Docker image names
          REPO_NAME=$(echo "${{ github.repository }}" | sed 's/-*$//' | tr '[:upper:]' '[:lower:]')
          echo "name=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.service }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=test-

      - name: Build ${{ matrix.service }} image (test only)
        uses: docker/build-push-action@v5
        with:
          context: ./packages/${{ matrix.service }}
          file: ./packages/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build successful for ${{ matrix.service }}
        run: |
          echo "✅ La imagen ${{ matrix.service }} se construyó exitosamente"
          echo "Tags que se utilizarían: ${{ steps.meta.outputs.tags }}"
