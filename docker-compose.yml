version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gemini-mail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gemini_mail
      POSTGRES_USER: gemini_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gemini-mail-network

  redis:
    image: redis:7-alpine
    container_name: gemini-mail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - gemini-mail-network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: gemini-mail-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gemini_mail
      DB_USER: gemini_user
      DB_PASSWORD: ${DB_PASSWORD:-changeme123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - gemini-mail-network
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: gemini-mail-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gemini-mail-network

volumes:
  postgres-data:
  redis-data:

networks:
  gemini-mail-network:
    driver: bridge
